<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Latest Instagram Post</title>
    <style>
      body { margin: 0; background: transparent; }
      .wrap { width: 100%; max-width: 100%; margin: 0; }
    
      /* Make Instagram embed allowed to shrink */
      blockquote.instagram-media {
        width: 100% !important;
        max-width: 100% !important;
        min-width: 0 !important;
        margin: 0 !important;
      }
    
      /* The embed injects an iframe-ish structure; this helps in some cases */
      .instagram-media-rendered,
      iframe {
        max-width: 100% !important;
        min-width: 0 !important;
      }

      /* Kill any minimum widths Instagram injects */
      iframe.instagram-media,
      .instagram-media-rendered {
        min-width: 0 !important;
        width: 100% !important;
        max-width: 100% !important;
      }
      
      /* Also make sure the wrapper can shrink */
      #ig-root, .ig-scale {
        max-width: 100% !important;
        min-width: 0 !important;
        overflow: hidden;
      }

      /* Scaling wrapper */
      .ig-scale {
        transform-origin: top left;
      }

      a.ViewProfileButton, a.FollowButton {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div class="wrap" id="ig-root"></div>

    <!-- Instagram embed script (must be present) -->
    <script async src="https://www.instagram.com/embed.js"></script>
    <script src="./widget.js"></script>
  </body>
</html>
